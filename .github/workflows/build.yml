name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check add-on package
        run: python tools/check_addon.py

      # AnkiWeb requires the add-on files at the root of the archive,
      # with no __pycache__ folders inside.
      - name: Build .ankiaddon
        run: |
          cd context_search
          zip -r ../context_search.ankiaddon . -x '*__pycache__*' -x 'meta.json'
          cd ..
          unzip -l context_search.ankiaddon

      - uses: actions/upload-artifact@v4
        with:
          name: context_search-ankiaddon
          path: context_search.ankiaddon

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build .ankiaddon
        run: |
          cd context_search
          zip -r ../context_search.ankiaddon . -x '*__pycache__*' -x 'meta.json'

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" context_search.ankiaddon --generate-notes
